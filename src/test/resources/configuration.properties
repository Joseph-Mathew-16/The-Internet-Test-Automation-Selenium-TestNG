# Configuration file for the test automation suite.
url=https://the-internet.herokuapp.com/
# Wait durations in seconds
timeouts.durations.implicit-wait=10
timeouts.durations.page-load-timeout=10
timeouts.durations.explicit-wait=5
# Browser configurations
browser.browser-execution.chrome=true
browser.browser-execution.firefox=false
browser.browser-execution.edge=false
browser.browser-execution.safari=false
browser.headless-mode=true
browser.window-size.width=1920
browser.window-size.height=1080
# Retry logic configurations
retry-logic.max-retries=3
# Report configurations. Steps with a level above report.log-level are not logged.
# 0 - OFF - No logs.
# 1 - ERROR - Framework and test data errors (Allure: broken).
# 2 - FAIL - Failed test steps (Allure: failed).
# 3 - WARN - Warnings that may indicate a failure (Allure: passed).
# 4 - INFO - Informational steps that do not decide pass/fail (Allure: passed).
# 5 - PASS - Completed test actions such as click, enter text, launch browser (Allure: passed).
# 6 - DEBUG - Framework internals such as configuration and setup (Allure: passed).
report.log-level=6