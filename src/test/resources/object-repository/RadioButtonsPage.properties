# Locators for pages.RadioButtonsPage. Format: key=strategy:value, see utilities.ObjectRepository.
# {0} is replaced by the argument passed to locator(...).
resultText=id:result
# Colour radio ids equal the colour values, e.g. "green".
colorRadio=id:{0}
# Sport radios have no id, so the value attribute is used, e.g. "tennis".
sportRadio=css:input[name='sport'][value='{0}']
